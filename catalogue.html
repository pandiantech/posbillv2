<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catalogue — Pandian Tech Service</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#f8f9fa;
      --card:#ffffff;
      --muted:#6b7280;
      --text:#111827;
      --accent:#374151;
      --accent-2:#e6e6e6;
      --active:#eef2ff;
    }
    *{box-sizing:border-box}
    body{
      font-family:'Quicksand',system-ui,Segoe UI,Arial;
      margin:0;background:var(--bg);color:var(--text);
    }

    .wrap{max-width:1100px;margin:18px auto;padding:16px}

    h1{margin:0;font-size:18px}
    .lead{color:var(--muted);font-size:13px;margin-top:4px}

    .toolbar{display:flex;gap:8px;align-items:center;margin-top:16px}
    .search{flex:1}
    input[type=search]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--accent-2)}
    button{background:#111827;color:#fff;border:0;padding:10px 12px;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent-2)}
    .grid{display:grid;grid-template-columns:280px 1fr;gap:16px;margin-top:18px}
    @media(max-width:880px){.grid{grid-template-columns:1fr}}
    .card{background:var(--card);padding:14px;border-radius:10px;box-shadow:0 6px 18px rgba(16,24,40,0.04)}
    .left{display:flex;flex-direction:column;gap:12px}
    .cat-list button {
      display:block;
      width:100%;
      text-align:left;
      padding:8px;
      border-radius:8px;
      border:1px solid #f1f1f1;
      background:transparent;
      color:#6d28d9;
      font-weight:600;
      transition:color 0.3s ease;
    }
    .cat-list button:hover { color:#111827; }
    .cat-list button.active { color:#dc2626; border-color:#dc2626; }

    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .product{background:#fff;border-radius:10px;padding:10px;border:1px solid #f1f1f1;display:flex;flex-direction:column}
    .product .imgwrap{height:120px;display:flex;align-items:center;justify-content:center;background:#fafafa;border-radius:6px;margin-bottom:8px}
    .product img{max-width:100%;max-height:110px;object-fit:contain}
    .p-title{font-weight:600;margin:6px 0}
    .p-meta{font-size:13px;color:var(--muted)}
    .p-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

    /* modal */
    .modal{position:fixed;inset:0;background:rgba(2,6,23,0.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
    .modal.open{display:flex}
    .modal-card{background:#fff;border-radius:10px;max-width:760px;width:100%;padding:16px}
    .form-grid{display:grid;grid-template-columns:1fr 180px;gap:12px}
    @media(max-width:880px){.form-grid{grid-template-columns:1fr}}
    label{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
    input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #e6e6e6}
    .ksmall{font-size:13px;color:var(--muted)}
    .small-btn{padding:6px 8px;font-size:13px}

    #scanModal .modal-card{max-width:480px;text-align:center}
    #reader{width:100%;height:300px;border-radius:8px;overflow:hidden}

    .cat-controls{display:flex;gap:8px;align-items:center;margin-top:8px}
    .cat-controls input{flex:1;padding:8px;border-radius:8px;border:1px solid var(--accent-2)}
    .cat-controls button{padding:8px 10px;border-radius:8px}

    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 22px;
      background: #111827;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 20000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); pointer-events: auto; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="toolbar">
      <div class="search"><input id="q" type="search" placeholder="Search product or barcode..."></div>
      <button id="addBtn">+ Add Product</button>
      <button id="exportBtn" class="ghost">Export JSON</button>
    </div>

    <div class="grid">
      <div class="left card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <strong>Categories</strong>
          <div><button id="showAll" class="ghost small-btn">All</button></div>
        </div>

        <div class="cat-list" id="catList" style="margin-top:8px"></div>

        <div class="cat-controls">
          <select id="categorySelect" style="width:50%;"></select>
          <button id="deleteCategoryBtn" class="ghost small-btn">Delete Selected</button>
        </div>

        <div style="margin-top:8px;display:flex;gap:8px">
          <input id="addCategoryInput" placeholder="Add new category">
          <button id="addCategoryBtn" class="ghost small-btn">Add</button>
        </div>

        <hr>
        <div>
          <strong>Quick actions</strong>
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
            <button id="bulkBarcode" class="ghost small-btn">Download All Barcodes</button>
            <button id="importBtn" class="ghost small-btn">Import JSON</button>
            <input id="fileImport" type="file" accept="application/json" style="display:none">
          </div>
        </div>
      </div>

      <div class="card">
        <div id="productList" class="product-grid"></div>
      </div>
    </div>
  </div>

  <!-- product modal -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <h3 id="modalTitle">Add Product</h3>
      <div style="margin-top:8px" class="form-grid">
        <div>
          <div class="field"><label>Product Name</label><input id="pname"></div>

          <div class="field">
            <label>Category</label>

            <!-- Hidden legacy input kept for function compatibility -->
            <input id="pcat" type="hidden">

            <!-- New select for UI -->
            <select id="pcatSelect">
              <option value="">-- Select Category --</option>
            </select>

            <!-- New-category UI (hidden until user chooses to add) -->
            <div id="newCategoryWrap" style="display:none;margin-top:8px;">
              <input id="pcatNew" placeholder="Enter new category name">
              <button id="addNewCategoryBtn" class="ghost small-btn" type="button">Add</button>
            </div>
          </div>

          <div class="field"><label>Billing Price (₹)</label><input id="pprice" type="number"></div>
          <div class="field"><label>Purchase Price (₹)</label><input id="ppurchase" type="number"></div>
          <div class="field"><label>Stock Quantity</label><input id="pstock" type="number" value="1"></div>

          <div class="field">
            <label>Barcode (leave empty to auto-generate)</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <input id="pbarcode" style="flex:1">
              <button id="scanBarcodeBtn" type="button" class="ghost small-btn">📷</button>
            </div>
          </div>

          <div class="field"><label>Image (optional)</label><input id="pimg" type="file" accept="image/*"></div>
        </div>

        <div>
          <div style="border:1px dashed var(--accent-2);padding:12px;border-radius:8px;text-align:center">
            <div class="imgwrap">
              <img id="previewImg" src="" style="max-height:110px;max-width:100%">
            </div>
            <div style="margin-top:8px">
              <label class="ksmall">Barcode preview</label>
              <div id="barcodeWrap" style="margin-top:8px"></div>
            </div>
          </div>
          <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
            <button id="saveProduct">Save</button>
            <button id="cancelProduct" class="ghost">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

 <!-- barcode scanner modal -->
<div id="scanModal" class="modal" aria-hidden="true">
  <div class="modal-card" style="max-width:480px">

    <h3>Scan Barcode</h3>

    <!-- Scanner Area -->
    <div id="reader" style="
      width:100%;height:310px;background:#000;
      border-radius:12px;overflow:hidden;position:relative;
    ">
      <!-- Laser -->
      <div id="laserLine" style="
        position:absolute;left:15%;right:15%;
        height:3px;background:red;opacity:.8;
        animation:laserMove 1.4s infinite alternate;
      "></div>

      <style>
        @keyframes laserMove {0%{top:20%}100%{top:75%}}
      </style>
    </div>

    <!-- Buttons -->
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <select id="scanQuality" class="ghost small-btn" style="flex:1">
        <option value="auto">Auto</option>
        <option value="720">720p</option>
        <option value="1080">1080p</option>
      </select>

      <button id="scanSwitch" class="ghost small-btn">Switch</button>
      <button id="scanTorch" class="ghost small-btn">Torch</button>

      <button id="scanCloseBtn" class="ghost small-btn" style="margin-left:auto">
        Close
      </button>
    </div>

  </div>
</div>


  <!-- toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- external libs -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <script>
  (function(){
    const $ = id => document.getElementById(id);
    const PRODUCTS_KEY = 'products';
    const CATEGORIES_KEY = 'categories';
    const SETTINGS_KEY = 'companyDetails';
    let products = JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]');
    let categories = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || '[]');
    let selectedCategory = null;

    const toastEl = $('toast');
    function showToast(msg){
      if(!toastEl) return;
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(()=>{ toastEl.classList.remove('show'); }, 2000);
    }

    // Company name dynamic in header (kept for compatibility, safe no-op when header removed)
    function updateCompanyTitle(){
      try{
        const cfg = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
        const name = cfg.companyName || 'Pandian Tech Service';
        const el = document.getElementById('companyTitle');
        if(el) el.innerText = name;
      }catch(e){}
    }
    updateCompanyTitle();
    window.addEventListener('storage', ()=> updateCompanyTitle());
    window.addEventListener('focus', ()=> updateCompanyTitle());

    // If categories empty, derive from products
    function ensureCategoriesFromProducts(){
      const catSet = new Set(categories || []);
      products.forEach(p => { if(p.category) catSet.add(p.category); });
      categories = Array.from(catSet);
      saveCategories(false);
    }

    function saveCategories(updateUi=true){ localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories)); if(updateUi) { renderCategories(); populateCategorySelect(); } }
    function saveProducts(){ localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products)); render(); }

    function nextBarcode(){
      const nums = products.map(p=>p.barcode)
        .filter(Boolean)
        .map(b=>{ const m = String(b).match(/PTS0*(\d+)/i); return m ? parseInt(m[1],10) : 0; });
      const next = (nums.length?Math.max(...nums)+1:1);
      return 'PTS'+String(next).padStart(4,'0');
    }

    // render product grid with both search q and selectedCategory applied
    function render(){
      ensureCategoriesFromProducts();
      const list = $('productList'); list.innerHTML='';
      const q = ($('q').value || '').toLowerCase().trim();

      const filtered = products.filter(p=>{
        if(selectedCategory && selectedCategory !== 'All' && (p.category || 'Uncategorized') !== selectedCategory) return false;
        if(!q) return true;
        return (p.name||'').toLowerCase().includes(q) || (p.barcode||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q);
      });

      if(!filtered.length){
        list.innerHTML = '<div style="padding:20px;color:var(--muted)">No products found.</div>';
        return;
      }

      filtered.forEach(p=>{
        const div = document.createElement('div'); div.className='product';
        div.innerHTML = `
          <div class="imgwrap"><img src="${p.image||''}" onerror="this.style.display='none'"></div>
          <div class="p-title">${escapeHtml(p.name)}</div>
          <div class="p-meta">₹ ${p.price} • Stock: ${p.stock}</div>
          <div class="p-meta">Category: ${escapeHtml(p.category||'Uncategorized')}</div>
          <div class="p-meta">Barcode: ${escapeHtml(p.barcode||'')}</div>
          <div class="p-actions">
            <button class="ghost small-btn" onclick="editProduct('${p.id}')">Edit</button>
            <button class="ghost small-btn" onclick="downloadBarcode('${p.id}')">Download</button>
            <button class="ghost small-btn" onclick="deleteProduct('${p.id}')">Delete</button>
          </div>`;
        list.appendChild(div);
      });
      renderCategories(categories);
    }

    function renderCategories(cats){
      const el = $('catList'); el.innerHTML='';
      const sorted = (cats||[]).slice().sort((a,b)=>a.localeCompare(b));
      sorted.forEach(c=>{
        const b = document.createElement('button');
        b.textContent = c;
        b.className = (selectedCategory===c) ? 'active' : '';
        b.onclick = ()=>{ selectedCategory = c; $('q').value = ''; highlightSelectedCategory(); render(); populateCategorySelect(); };
        el.appendChild(b);
      });
    }

    function highlightSelectedCategory(){
      document.querySelectorAll('.cat-list button').forEach(btn=>{
        btn.classList.toggle('active', btn.textContent === selectedCategory);
      });
    }

    // populate both selects: left-side delete select and modal pcatSelect
    function populateCategorySelect(){
      const sel = $('categorySelect'); sel.innerHTML = '';
      const modalSel = $('pcatSelect'); modalSel.innerHTML = '';
      const defaultOpt = document.createElement('option'); defaultOpt.value = ''; defaultOpt.text = '-- Select category --'; sel.appendChild(defaultOpt);
      const defaultOpt2 = document.createElement('option'); defaultOpt2.value = ''; defaultOpt2.text = '-- Select Category --'; modalSel.appendChild(defaultOpt2);

      const arr = (categories||[]).slice().sort((a,b)=>a.localeCompare(b));
      arr.forEach(c=>{
        const o = document.createElement('option'); o.value = c; o.text = c;
        if(c === selectedCategory) o.selected = true;
        sel.appendChild(o);

        const o2 = document.createElement('option'); o2.value = c; o2.text = c;
        modalSel.appendChild(o2);
      });

      // add an "Add new" option at end of modal select
      const addNewOption = document.createElement('option');
      addNewOption.value = '__add_new__';
      addNewOption.text = '-- Add new category... --';
      modalSel.appendChild(addNewOption);
    }

    // UI event wiring
    $('addBtn').addEventListener('click', ()=> openModal());
    $('cancelProduct').addEventListener('click', ()=> closeModal());
    $('q').addEventListener('input', ()=> { selectedCategory = null; highlightSelectedCategory(); render(); });

    $('showAll').addEventListener('click', ()=>{ selectedCategory = null; $('q').value=''; highlightSelectedCategory(); render(); populateCategorySelect(); });

    // category add/delete buttons
    $('addCategoryBtn').addEventListener('click', ()=>{
      const v = ($('addCategoryInput').value||'').trim();
      if(!v) return alert('Enter category name');
      if(!categories.includes(v)){
        categories.push(v);
        saveCategories();
        $('addCategoryInput').value='';
        render();
      } else alert('Category exists');
    });

    $('deleteCategoryBtn').addEventListener('click', ()=>{
      const sel = $('categorySelect').value;
      if(!sel) return alert('Select a category to delete');
      if(!confirm(`Delete category "${sel}" and ALL its products? This cannot be undone.`)) return;
      // Remove category and associated products
      categories = (categories||[]).filter(c=>c!==sel);
      products = products.filter(p=> (p.category||'Uncategorized') !== sel);
      selectedCategory = null;
      saveCategories(); saveProducts();
      populateCategorySelect(); render();
    });

    // modal open/close, fill/clear
    const modal = $('modal');
    function openModal(p){
      modal.classList.add('open');
      // ensure category selects up-to-date
      populateCategorySelect();
      if(p){ fillForm(p); $('modalTitle').innerText='Edit Product'; }
      else { clearForm(); $('modalTitle').innerText='Add Product'; }
    }
    function closeModal(){ modal.classList.remove('open'); }

    function clearForm(){
      $('pname').value=''; $('pcat').value=''; if($('pcatSelect')) $('pcatSelect').value = '';
      $('pprice').value=''; $('ppurchase').value='';
      $('pstock').value=1; $('pbarcode').value=''; $('previewImg').src=''; $('barcodeWrap').innerHTML='';
      $('pimg').value = '';
      $('saveProduct').dataset.editId = '';
      // hide add-new UI
      if($('newCategoryWrap')) $('newCategoryWrap').style.display = 'none';
      if($('pcatNew')) $('pcatNew').value = '';
    }
    function fillForm(p){
      $('pname').value = p.name || '';
      // ensure category selects updated then set values
      populateCategorySelect();
      $('pcat').value = p.category || '';
      if($('pcatSelect')) $('pcatSelect').value = p.category || '';
      $('pprice').value = p.price || 0;
      $('ppurchase').value = p.purchase || 0;
      $('pstock').value = p.stock || 0;
      $('pbarcode').value = p.barcode || '';
      $('previewImg').src = p.image || '';
      renderBarcode(p.barcode || '');
      $('saveProduct').dataset.editId = p.id;
    }

    // Keep modal pcatSelect <-> hidden pcat in sync
    function wireCategoryModalSync(){
      const sel = $('pcatSelect');
      const hidden = $('pcat');
      const wrap = $('newCategoryWrap');
      const newInput = $('pcatNew');
      const addNewBtn = $('addNewCategoryBtn');

      if(!sel || !hidden) return;

      sel.addEventListener('change', ()=>{
        const val = sel.value;
        if(val === '__add_new__'){
          if(wrap) wrap.style.display = 'block';
          if(newInput) newInput.focus();
          // clear hidden until user adds
          hidden.value = '';
        } else {
          if(wrap) wrap.style.display = 'none';
          hidden.value = val || '';
        }
      });

      if(addNewBtn){
        addNewBtn.addEventListener('click', ()=>{
          const nv = (newInput.value||'').trim();
          if(!nv) return alert('Enter category name');
          if(!categories.includes(nv)){
            categories.push(nv);
            saveCategories();
            // select the new category in the modal select
            populateCategorySelect();
            if(sel) sel.value = nv;
            if(hidden) hidden.value = nv;
            // hide new input
            if(wrap) wrap.style.display = 'none';
            if(newInput) newInput.value = '';
            showToast(`New category "${nv}" added`);
          } else {
            // already exists: just select it
            populateCategorySelect();
            if(sel) sel.value = nv;
            if(hidden) hidden.value = nv;
            if(wrap) wrap.style.display = 'none';
            showToast(`Category "${nv}" already exists`);
          }
        });
      }

      // allow Enter in pcatNew to add quickly
      if(newInput){
        newInput.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter'){ e.preventDefault(); if(addNewBtn) addNewBtn.click(); }
        });
      }
    }

    // image preview
    $('pimg').addEventListener('change', e=>{
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader(); r.onload = ()=>{ $('previewImg').src=r.result; }; r.readAsDataURL(f);
    });

    // render barcode preview
    function renderBarcode(code){
      const wrap = $('barcodeWrap'); wrap.innerHTML='';
      if(!code) return;
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      wrap.appendChild(svg);
      try{ JsBarcode(svg, code, {format:'CODE128',displayValue:true,height:50}); }catch(e){}
    }

    // save product (add or edit)
    $('saveProduct').addEventListener('click', ()=>{
      const name = $('pname').value.trim();
      if(!name){ alert('Product name required'); return; }
      // use hidden pcat (keeps original code paths)
      let catVal = ($('pcat').value || '').trim();
      if(!catVal && $('pcatSelect') && $('pcatSelect').value && $('pcatSelect').value !== '__add_new__'){
        catVal = $('pcatSelect').value;
      }
      if(!catVal) catVal = 'Uncategorized';

      $('pcat').value = catVal; // ensure hidden input populated for legacy usage

      let barcode = $('pbarcode').value.trim();
      if(!barcode) barcode = nextBarcode();

      const editId = $('saveProduct').dataset.editId;
      if(editId){
        // update existing product
        const p = products.find(x=>x.id === editId);
        if(!p) return alert('Product not found');
        p.name = name;
        p.category = catVal;
        p.price = Number($('pprice').value) || 0;
        p.purchase = Number($('ppurchase').value) || 0;
        p.stock = Number($('pstock').value) || 0;
        p.barcode = barcode;
        p.image = $('previewImg').src || '';
      } else {
        const obj = {
          id:'prod_'+Date.now(),
          name:name,
          category: catVal,
          price:Number($('pprice').value)||0,
          purchase:Number($('ppurchase').value)||0,
          stock:Number($('pstock').value)||0,
          barcode:barcode,
          image:$('previewImg').src||''
        };
        products.push(obj);
      }

      // ensure category exists
      const newCat = (catVal||'').trim();
      if(newCat && !categories.includes(newCat)) {
        categories.push(newCat);
        showToast(`New category "${newCat}" added`);
      }

      saveCategories();
      saveProducts();
      closeModal();
    });

    // product edit/delete/download functions
    window.editProduct = id=>{
      const p = products.find(x=>x.id===id); if(!p) return alert('Not found'); openModal(p);
    };
    window.deleteProduct = id=>{
      if(!confirm('Delete product?')) return;
      products = products.filter(x=>x.id !== id);
      saveProducts();
    };

    window.downloadBarcode = id=>{
      const p = products.find(x=>x.id===id);
      if(!p) return alert('Not found');
      const canvas=document.createElement('canvas');
      JsBarcode(canvas,p.barcode,{format:'CODE128',displayValue:true,height:60,width:2});
      const a=document.createElement('a');
      a.href=canvas.toDataURL('image/png');
      a.download='Barcode_'+p.barcode+'.png';
      a.click();
    };

    // bulk download barcodes
    $('bulkBarcode').addEventListener('click', ()=>{
      if(!products.length) return alert('No products');
      products.forEach(p=>{
        const canvas=document.createElement('canvas');
        JsBarcode(canvas,p.barcode,{format:'CODE128',displayValue:true,height:60,width:2});
        const a=document.createElement('a');
        a.href=canvas.toDataURL('image/png');
        a.download='Barcode_'+p.barcode+'.png';
        a.click();
      });
    });

    // export/import
    $('exportBtn').addEventListener('click', ()=>{
      const blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='products.json';
      a.click();
    });

    $('importBtn').addEventListener('click', ()=> $('fileImport').click());
    $('fileImport').addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const arr=JSON.parse(r.result);
          if(Array.isArray(arr)){
            // normalize imported products and add unique ids if missing
            const added = [];
            arr.forEach(item=>{
              const obj = Object.assign({ id: 'prod_'+Date.now()+Math.floor(Math.random()*1000) }, item);
              if(!obj.barcode) obj.barcode = nextBarcode();
              products.push(obj);
              added.push(obj);
            });
            saveProducts();
            ensureCategoriesFromProducts();
            alert('Imported '+added.length+' products');
          } else alert('Invalid file format (expecting array)');
        } catch(err){ alert('Invalid file'); }
      };
      r.readAsText(f);
    });

/* ==========================================================
   CATALOGUE — UNIVERSAL SCANNER PRO++ (drop-in)
   Paste after html5-qrcode & JsBarcode scripts are loaded.
   Usage: CATSCAN_PRO.init(); (it auto-wires #scanBarcodeBtn)
========================================================== */
(function(){
  const CATSCAN_PRO = {
    qr: null,
    cams: [],
    index: 0,
    track: null,
    autofocusTimer: null,
    lastScan: 0,
    debounce: 900,
    onResult: null,
    usbBuffer: '',
    usbTimeout: null,

    init(){
      const btn = document.getElementById("scanBarcodeBtn");
      if(btn) btn.addEventListener('click', ()=> this.open(code => {
        // default callback: fill pbarcode + preview
        const inp = document.getElementById("pbarcode");
        if(inp) inp.value = code;

        const wrap = document.getElementById("barcodeWrap");
        if(wrap){
          wrap.innerHTML = "";
          const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
          wrap.appendChild(svg);
          try { JsBarcode(svg, code, { format:"CODE128", displayValue:true, height:50 }); } catch(e){}
        }

        showToast && typeof showToast === 'function' && showToast("Scanned: " + code);
      }));
    },

    /* ---------- open modal and build UI ---------- */
    async open(callback){
      this.onResult = callback || null;

      const modal = document.getElementById("scanModal");
      const reader = document.getElementById("reader");
      if(!modal || !reader) { alert("Scanner modal or reader element missing."); return; }

      // ensure modal visible
      modal.classList.add("open");
      modal.setAttribute("aria-hidden","false");

      // build inner safe container (html5-qrcode will attach inside #scanArea)
      reader.innerHTML = `
        <div id="scanWrap" style="position:relative;width:100%;height:330px;border-radius:12px;overflow:hidden;background:#000;">
          <div id="scanArea" style="width:100%;height:100%;position:relative;z-index:0;"></div>

          <!-- Scan box (visual overlay) -->
          <div style="position:absolute;left:14%;top:18%;width:72%;height:60%;pointer-events:none;z-index:2">
            <div style="position:absolute;left:0;top:0;width:22px;height:22px;border-top:3px solid #22c55e;border-left:3px solid #22c55e"></div>
            <div style="position:absolute;right:0;top:0;width:22px;height:22px;border-top:3px solid #22c55e;border-right:3px solid #22c55e"></div>
            <div style="position:absolute;left:0;bottom:0;width:22px;height:22px;border-bottom:3px solid #22c55e;border-left:3px solid #22c55e"></div>
            <div style="position:absolute;right:0;bottom:0;width:22px;height:22px;border-bottom:3px solid #22c55e;border-right:3px solid #22c55e"></div>
          </div>

          <!-- Laser -->
          <div id="proLaser" style="position:absolute;left:16%;right:16%;height:3px;background:red;opacity:.9;z-index:2;animation:proLaserAnim 1.6s infinite alternate;"></div>

          <style>
            @keyframes proLaserAnim {0%{top:28%}100%{top:70%}}
            /* prevent html5-qrcode from breaking out */
            #scanArea video{object-fit:cover;width:100% !important;height:100% !important;display:block}
            #scanWrap{contain:paint; -webkit-transform: translateZ(0);} /* help compositing */
          </style>
        </div>

        <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
          <select id="proQuality" style="padding:6px;border-radius:6px;border:1px solid #ccc">
            <option value="auto">Quality: Auto</option>
            <option value="720">720p</option>
            <option value="1080">1080p</option>
          </select>
          <button id="proSwitch" class="ghost small-btn">Switch</button>
          <button id="proTorch" class="ghost small-btn">Torch</button>
          <button id="proClose" class="ghost small-btn" style="margin-left:auto">Close</button>
        </div>

        <!-- hidden input to capture USB / keyboard scanner events -->
        <input id="proUsbCapture" type="text" inputmode="numeric" style="position:absolute;opacity:0;pointer-events:none;left:-9999px;top:-9999px" aria-hidden="true">
      `;

      // attach controls
      document.getElementById("proClose").onclick = ()=> this.close();
      document.getElementById("proSwitch").onclick = ()=> this.switchCam();
      document.getElementById("proTorch").onclick = ()=> this.toggleTorch();
      document.getElementById("proQuality").onchange = ()=> this.restart();

      // focus hidden input to capture usb scanner keys
      const usbInp = document.getElementById("proUsbCapture");
      usbInp && usbInp.focus();

      // global key listener (fallback) for scanners that emulate keyboard without focusing the input
      this._boundKeyHandler = event => this._onKeyEvent(event);
      window.addEventListener('keydown', this._boundKeyHandler, true);

      // also listen on the hidden input (recommended)
      usbInp && usbInp.addEventListener('input', (e) => {
        // some scanners fill the whole code at once
        const v = e.target.value.trim();
        if(v) {
          this._processUsbCode(v);
          e.target.value = '';
        }
      });

      // start camera scanning
      await this.start();
    },

    /* ---------- start html5-qrcode scanner ---------- */
    async start(){
      if(typeof Html5Qrcode === 'undefined'){ alert("Scanner library missing"); return this.close(); }

      try {
        // init instance targeting the div id "scanArea"
        this.qr = new Html5Qrcode("scanArea", { verbose: false });

        // get cameras
        this.cams = await Html5Qrcode.getCameras();
        if(!this.cams || !this.cams.length){ alert("No camera detected"); return this.close(); }

        // prioritize back -> front -> others
        this.cams = this._sortCameras(this.cams);
        this.index = 0;

        await this._startCam();
      } catch(err){
        console.error("Scanner start failed", err);
        alert("Camera start failed: " + (err && err.message ? err.message : err));
        this.close();
      }
    },

    async _startCam(){
      const cam = this.cams[this.index];
      const quality = (document.getElementById("proQuality") || {}).value || 'auto';
      const config = { fps: 12, qrbox: { width: 280, height: 140 } };

      if(quality === '720') config.videoConstraints = { height: { ideal: 720 } };
      if(quality === '1080') config.videoConstraints = { height: { ideal: 1080 } };

      // be careful: html5-qrcode.start may throw if access denied
      await this.qr.start({ deviceId: { exact: cam.id } }, config, (decoded) => this._onDecoded(decoded), (err) => { /* errors ignored */ });

      // wait a moment then prepare track for torch & autofocus
      setTimeout(()=> this._prepareTrack(), 600);
    },

    async _prepareTrack(){
      try {
        const video = document.querySelector("#scanArea video");
        if(video && video.srcObject && video.srcObject.getVideoTracks().length){
          this.track = video.srcObject.getVideoTracks()[0];

          // autofocus attempts every 2s (best-effort)
          this._autoFocusOnce();
          try{ this.autofocusTimer = setInterval(()=> this._autoFocusOnce(), 2000); } catch(e){}
        } else this.track = null;
      } catch(e){ this.track = null; }
    },

    _autoFocusOnce(){
      try {
        if(!this.track) return;
        const caps = this.track.getCapabilities ? this.track.getCapabilities() : {};
        if(caps && caps.focusMode && caps.focusMode.includes('continuous')){
          this.track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
        }
      } catch(e){}
    },

    /* ---------- decoded handler ---------- */
    async _onDecoded(raw){
      const now = Date.now();
      if(now - this.lastScan < this.debounce) return;
      this.lastScan = now;

      const code = (raw||'').toString().trim();
      if(!code) return;

      // beep + vibrate
      this._beep();
      try{ navigator.vibrate && navigator.vibrate(120); } catch(e){}

      // try find product in your dataset (expects global 'products' array)
      const found = this._findProductByBarcode(code);

      // If a product exists, call callback and CLOSE scanner (auto-close only on product found)
      if(found){
        // callback (fill input etc)
        try { if(this.onResult) this.onResult(code); } catch(e){ console.warn(e); }

        // small delay so UI shows beep/vibrate before closing
        setTimeout(()=> { this.close(); }, 220);
      } else {
        // product not found: play "error" short beep & keep scanning
        this._beepError();
        showToast && typeof showToast === 'function' && showToast("Product not found: " + code);
        // do not close; allow continuous scanning
      }
    },

    /* ---------- find product helper (change if your store uses a different structure) ---------- */
    _findProductByBarcode(code){
      try {
        if(typeof products === 'undefined' || !Array.isArray(products)) return null;
        return products.find(p => (p.barcode||'').toString() === code.toString()) || null;
      } catch(e){ return null; }
    },

    /* ---------- switch camera ---------- */
    async switchCam(){
      try {
        await this._stopQuiet();
        this.index = (this.index + 1) % (this.cams.length || 1);
        await this._startCam();
      } catch(e){ console.warn(e); }
    },

    /* ---------- toggle torch ---------- */
    async toggleTorch(){
      if(!this.track) return alert("Torch unsupported on this camera");
      try {
        const caps = this.track.getCapabilities ? this.track.getCapabilities() : {};
        if(!caps.torch) return alert("Torch not available");
        const on = !this.track._torchOn;
        await this.track.applyConstraints({ advanced: [{ torch: on }] });
        this.track._torchOn = on;
      } catch(e){ alert("Torch error"); }
    },

    /* ---------- restart (quality change) ---------- */
    async restart(){
      await this._stopQuiet();
      await this._startCam();
    },

    /* ---------- stop quietly (used when switching) ---------- */
    async _stopQuiet(){
      try { clearInterval(this.autofocusTimer); } catch(e){}
      try { if(this.qr) await this.qr.stop(); } catch(e){}
      try { if(this.qr) this.qr.clear(); } catch(e){}
      try { if(this.track) this.track.stop(); } catch(e){}
      // also remove any leftover video srcObject
      try {
        const video = document.querySelector("#scanArea video");
        if(video && video.srcObject){
          const tracks = video.srcObject.getTracks() || [];
          tracks.forEach(t=>{ try{ t.stop(); } catch(e){} });
          try{ video.srcObject = null; } catch(e){}
        }
      } catch(e){}
    },

    /* ---------- full close & cleanup ---------- */
    async close(){
      try {
        await this._stopQuiet();
      } catch(e){}
      // remove event listeners and usb capture
      try { window.removeEventListener('keydown', this._boundKeyHandler, true); } catch(e){}
      this._boundKeyHandler = null;

      // clear reader to ensure html5-qrcode cannot inject video outside
      try {
        const reader = document.getElementById("reader");
        if(reader) reader.innerHTML = '';
      } catch(e){}

      const modal = document.getElementById("scanModal");
      if(modal){
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden","true");
      }
    },

    /* ---------- camera sorting ---------- */
    _sortCameras(list){
      const back = list.filter(c => /back|rear|environment/i.test(c.label || ''));
      const front = list.filter(c => /front|user/i.test(c.label || ''));
      const others = list.filter(c => !back.includes(c) && !front.includes(c));
      // If labels are empty, keep original order but prefer first as back
      return [...back, ...front, ...others];
    },

    /* ---------- loud beep (with ramp) ---------- */
    _beep(){
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        // resume if suspended (user gesture likely happened on scan button click)
        if(ctx.state === 'suspended' && typeof ctx.resume === 'function'){
          ctx.resume().catch(()=>{});
        }
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'square';
        o.frequency.value = 1400;
        // start very quiet and ramp up quickly to avoid clicks
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 0.02); // loud
        o.connect(g); g.connect(ctx.destination);
        o.start();
        setTimeout(()=>{
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
          try{ o.stop(); } catch(e){}
          try{ ctx.close(); } catch(e){}
        }, 180);
      } catch(e){}
    },

    /* ---------- short error beep (soft) ---------- */
    _beepError(){
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if(ctx.state === 'suspended' && typeof ctx.resume === 'function') ctx.resume().catch(()=>{});
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = 700;
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.01);
        o.connect(g); g.connect(ctx.destination);
        o.start();
        setTimeout(()=>{ g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.02); try{o.stop();}catch(e){} try{ctx.close();}catch(e){} }, 120);
      } catch(e){}
    },

    /* ---------- USB / keyboard scanner capture ---------- */
    _onKeyEvent(e){
      // Most hardware scanners act like keyboard: they send digits then Enter.
      // We'll capture digits and punctuation, and process on Enter.
      // Ignore if modifier keys used (user typing)
      if(e.altKey || e.ctrlKey || e.metaKey) return;

      const key = e.key;

      // If modal not open, ignore
      const modal = document.getElementById("scanModal");
      if(!modal || modal.getAttribute("aria-hidden") === 'true') { this.usbBuffer=''; return; }

      // If Enter -> process buffer
      if(key === 'Enter'){
        const code = this.usbBuffer.trim();
        this.usbBuffer = '';
        if(code) {
          // slight async gap to mimic camera detection timing
          setTimeout(()=> this._processUsbCode(code), 10);
        }
        // prevent page submit while scanning
        e.preventDefault();
        return;
      }

      // Accept digits and common barcode chars
      if(/^[0-9A-Za-z\-\._\/\s]$/.test(key)){
        this.usbBuffer += key;
        // reset buffer timeout (in case scanner sends slowly)
        if(this.usbTimeout) clearTimeout(this.usbTimeout);
        this.usbTimeout = setTimeout(()=> { this.usbBuffer = ''; }, 1200);
        // prevent propagation when modal open
        e.preventDefault();
      }
    },

    _processUsbCode(code){
      // emulate same flow as camera decode
      const now = Date.now();
      if(now - this.lastScan < this.debounce) return;
      this.lastScan = now;

      this._beep();
      try{ navigator.vibrate && navigator.vibrate(120); } catch(e){}

      const found = this._findProductByBarcode(code);
      if(found){
        try { if(this.onResult) this.onResult(code); } catch(e){}
        // close after a brief moment
        setTimeout(()=> this.close(), 180);
      } else {
        this._beepError();
        showToast && typeof showToast === 'function' && showToast("Product not found: " + code);
      }
    }
  };

  // expose globally for debugging and manual control
  window.CATSCAN_PRO = CATSCAN_PRO;

  // init automatically (wires button)
  try { CATSCAN_PRO.init(); } catch(e){ console.warn('CATSCAN_PRO.init failed', e); }

})();



    
    // utilities
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]); }

    // initial category ensure and render
    ensureCategoriesFromProducts();
    render();
    populateCategorySelect();
    wireCategoryModalSync();

    // expose small helper for debugging
    window.PandianCatalogue = { products, categories, saveProducts, saveCategories };

  })();
  </script>
